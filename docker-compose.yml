# Pantarr with its PostgreSQL database. Copy .env.example to .env and set PANTARR_SECRET and the passwords.
services:
  pantarr:
    # built from these sources (no published image yet)
    image: pantarr:local
    build: .
    container_name: pantarr
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    env_file: .env
    environment:
      DATABASE_URL: postgresql://pantarr:${POSTGRES_PASSWORD}@db:5432/pantarr
    ports:
      - "9925:9925"

  # Optional: Google Keep list sync (connector « Google Keep », companion address http://pantarr-keep:8080)
  pantarr-keep:
    build: apps/keep-companion
    container_name: pantarr-keep
    restart: unless-stopped
    profiles: ["keep"]

  db:
    image: postgres:16-alpine
    container_name: pantarr-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: pantarr
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: pantarr
    volumes:
      - pantarr-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pantarr"]
      interval: 5s
      retries: 20

volumes:
  pantarr-db:
